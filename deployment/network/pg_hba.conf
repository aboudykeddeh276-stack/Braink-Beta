# BrainK PostgreSQL host-based access policy
# Replace example CIDRs with the actual private runtime subnets before activation.
local   all                 all                                      peer
host    braink_control      braink_runtime      127.0.0.1/32          scram-sha-256
host    braink_control      braink_runtime      10.0.0.0/8            scram-sha-256
host    braink_control      braink_runtime      172.16.0.0/12         scram-sha-256
host    braink_control      braink_runtime      192.168.0.0/16        scram-sha-256

# Deny everything else explicitly.
host    all                 all                  0.0.0.0/0             reject
host    all                 all                  ::/0                  reject
