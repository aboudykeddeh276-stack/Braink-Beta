#!/usr/sbin/nft -f
flush ruleset

table inet braink_filter {
  set db_clients_v4 {
    type ipv4_addr
    flags interval
    elements = { 127.0.0.1 }
  }

  set admin_ssh_v4 {
    type ipv4_addr
    flags interval
    elements = { 127.0.0.1 }
  }

  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # ICMP for path-MTU and diagnostics.
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # HTTPS ingress for the public application/runtime edge.
    tcp dport 443 ct state new accept

    # SSH only from explicitly populated admin set.
    ip saddr @admin_ssh_v4 tcp dport 22 ct state new accept

    # PostgreSQL is never public. Only explicitly populated internal clients.
    ip saddr @db_clients_v4 tcp dport 5432 ct state new accept

    counter drop
  }

  chain output {
    type filter hook output priority 0; policy drop;

    oif "lo" accept
    ct state established,related accept

    # DNS through configured resolver.
    udp dport 53 accept
    tcp dport 53 accept

    # HTTPS for Git/Google/verification service calls.
    tcp dport 443 ct state new accept

    # PostgreSQL only to internal/private address space.
    ip daddr 10.0.0.0/8 tcp dport 5432 ct state new accept
    ip daddr 172.16.0.0/12 tcp dport 5432 ct state new accept
    ip daddr 192.168.0.0/16 tcp dport 5432 ct state new accept

    # NTP.
    udp dport 123 accept

    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
