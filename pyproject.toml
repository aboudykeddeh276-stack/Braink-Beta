[project]
name = "braink-beta-workspace-control-plane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
google = [
    "google-api-python-client",
]

[tool.setuptools]
packages = ["workspace_control_plane", "workspace_control_plane.actuators"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
